# EclipseLink 5.0: the provider specific equivalents of the common benchmark settings.
# Merged over bench-core's bench-common.properties; see CONFIG.md for the cross-provider table.
# @...@ is replaced by Maven at build time, ${...} by the harness at run time.

# --- harness -------------------------------------------------------------------------------------
bench.provider.name=EclipseLink
bench.provider.version=@eclipselink.version@
bench.provider.enhancement=@bench.enhancement@
bench.runner=@project.artifactId@
# EclipseLink accepts the DataSource object under the standard JPA key and then uses it as an external pool
bench.datasource.keys=jakarta.persistence.nonJtaDataSource

# --- provider ------------------------------------------------------------------------------------
jakarta.persistence.provider=org.eclipse.persistence.jpa.PersistenceProvider

# schema: never generate, update or validate (the DDL scripts are the only source of the schema)
eclipselink.ddl-generation=none

# deploy (build the session, log in) when the EMF is created, not lazily on the first EntityManager, so
# that the trial setup and emfBootstrap do the same work as with the other providers
eclipselink.deploy-on-startup=true

# begin the database transaction with EntityTransaction.begin(): without it EclipseLink runs the reads of a
# transaction on a separately acquired connection outside the transaction until the first write
eclipselink.transaction.join-existing=true

# JDBC batching with the common batch size; updates are ordered by id (EclipseLink always groups the
# statements of a commit by table in dependency order, there is no separate switch for inserts)
eclipselink.jdbc.batch-writing=JDBC
eclipselink.jdbc.batch-writing.size=${bench.jdbc.batchSize}
eclipselink.order-updates=true
eclipselink.persistence-context.commit-order=ID

# no shared (second level) cache, no query results cache
eclipselink.cache.shared.default=false
eclipselink.cache.query-results=false

# no provider-side statement cache (the default with an external DataSource; stated explicitly)
eclipselink.jdbc.cache-statements=false

# weaving: off by default (runtime weaving would need a java agent); the "weave" profile weaves at build time
eclipselink.weaving=@bench.weaving@

# minimal logging, no SQL logging
eclipselink.logging.level=WARNING
eclipselink.logging.level.sql=OFF
eclipselink.logging.parameters=false
