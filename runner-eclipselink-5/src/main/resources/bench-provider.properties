# EclipseLink 5.0 settings, merged over bench-common.properties (see CONFIG.md).
# @...@ is filtered by Maven, ${...} resolved by the harness.

# --- harness -------------------------------------------------------------------------------------
bench.provider.name=EclipseLink
bench.provider.version=@eclipselink.version@
bench.provider.enhancement=@bench.enhancement@
bench.runner=@project.artifactId@
# EclipseLink uses the DataSource object as an external pool
bench.datasource.keys=jakarta.persistence.nonJtaDataSource

# --- provider ------------------------------------------------------------------------------------
jakarta.persistence.provider=org.eclipse.persistence.jpa.PersistenceProvider

# schema: never generate, update or validate (the DDL scripts are the only source of the schema)
eclipselink.ddl-generation=none

# deploy when the EMF is created, not on the first EntityManager, like the other providers
eclipselink.deploy-on-startup=true

# begin the database transaction with EntityTransaction.begin(), not on the first write
eclipselink.transaction.join-existing=true

# JDBC batching with the common batch size; updates ordered by id (inserts are always grouped by table)
eclipselink.jdbc.batch-writing=JDBC
eclipselink.jdbc.batch-writing.size=${bench.jdbc.batchSize}
eclipselink.order-updates=true
eclipselink.persistence-context.commit-order=ID

# no shared (second level) cache, no query results cache
eclipselink.cache.shared.default=false
eclipselink.cache.query-results=false

# no statement cache (already the default with an external DataSource)
eclipselink.jdbc.cache-statements=false

# off by default; -Pweave and the *-woven runners weave statically at build time
eclipselink.weaving=@bench.weaving@

# minimal logging, no SQL logging
eclipselink.logging.level=WARNING
eclipselink.logging.level.sql=OFF
eclipselink.logging.parameters=false
