name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke run (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: ./mvnw -B package
      - name: Smoke run on H2
        # Add every implemented runner here. A smoke run only checks that all benchmarks execute.
        run: ./run.sh --smoke --skip-build --dbs h2 --datasets S --runners runner-hibernate-7 --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/
          if-no-files-found: ignore

  viz:
    name: bench-viz (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench-viz
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
