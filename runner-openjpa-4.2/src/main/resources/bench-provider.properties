# Apache OpenJPA 4.2 (JPA 3.2) settings, merged over bench-common.properties (see CONFIG.md).
# Same provider settings as runner-openjpa-4.1. @...@ is filtered by Maven, ${...} resolved by the harness.

# --- harness -------------------------------------------------------------------------------------
bench.provider.name=Apache OpenJPA
bench.provider.version=@openjpa.version@
# resolved build (the version, or version-timestamp-buildNumber for a snapshot) and its git revision
bench.provider.build=@openjpa.build@
bench.provider.revision=@openjpa.revision@
bench.provider.enhancement=@bench.enhancement@
bench.runner=@project.artifactId@
# nonJtaDataSource is a JNDI name for OpenJPA; ConnectionFactory2 is unset and falls back to the same DataSource
bench.datasource.keys=openjpa.ConnectionFactory

# --- provider ------------------------------------------------------------------------------------
jakarta.persistence.provider=org.apache.openjpa.persistence.PersistenceProviderImpl

# no schema generation: SynchronizeMappings is unset, the default "dynamic" schema factory does not read the schema

# declare the DDL's foreign keys logically (nothing is created), so that OpenJPA orders and batches by them
openjpa.jdbc.MappingDefaults=ForeignKeyDeleteAction=restrict, JoinForeignKeyDeleteAction=restrict

# JDBC batching with the common batch size; the dictionary is detected from the connection
openjpa.jdbc.DBDictionary=batchLimit=${bench.jdbc.batchSize}

# no second level cache (DataCache), no query result cache
openjpa.DataCache=false
openjpa.QueryCache=false

# the model is enhanced at build time or by the -javaagent (*-agent runners); unenhanced classes fail
openjpa.RuntimeUnenhancedClasses=unsupported
openjpa.DynamicEnhancementAgent=false

# no SQL logging, no diagnostics
openjpa.Log=DefaultLevel=WARN, Runtime=WARN, Tool=WARN, SQL=WARN, JDBC=WARN, Schema=WARN, MetaData=WARN, Enhance=WARN, Query=WARN
openjpa.ConnectionFactoryProperties=PrintParameters=false
