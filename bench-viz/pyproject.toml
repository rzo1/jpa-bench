[project]
name = "jpa-bench-viz"
version = "0.1.0"
description = "Charts and a static HTML report for jpa-bench (JMH) results"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "the jpa-bench authors" }]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
]

[project.scripts]
jpa-bench-viz = "jpa_bench_viz.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
