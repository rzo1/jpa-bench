# Apache OpenJPA 4.1: the provider specific equivalents of the common benchmark settings.
# Merged over bench-core's bench-common.properties; see CONFIG.md for the cross-provider table.
# @...@ is replaced by Maven at build time, ${...} by the harness at run time.

# --- harness -------------------------------------------------------------------------------------
bench.provider.name=Apache OpenJPA
bench.provider.version=@openjpa.version@
bench.provider.enhancement=@bench.enhancement@
bench.runner=@project.artifactId@
# OpenJPA reads jakarta.persistence.nonJtaDataSource as a JNDI name only; a DataSource object is accepted
# as openjpa.ConnectionFactory. openjpa.ConnectionFactory2 (non-transactional connections) is left unset,
# OpenJPA then falls back to the same DataSource.
bench.datasource.keys=openjpa.ConnectionFactory

# --- provider ------------------------------------------------------------------------------------
jakarta.persistence.provider=org.apache.openjpa.persistence.PersistenceProviderImpl

# schema: never generate, update or validate (the DDL scripts are the only source of the schema).
# openjpa.jdbc.SynchronizeMappings is deliberately not set; the default schema factory ("dynamic") does not
# read the database schema either.

# Foreign keys: OpenJPA orders the statements of a flush by the foreign keys it knows. With the dynamic schema
# factory it only knows those declared in the mapping defaults, so every mapped relation is declared as a
# (logical) restrict foreign key. Nothing is created in the database; this mirrors the FKs of our DDL so that
# inserts and deletes are ordered parent/child correctly (Hibernate's equivalent is order_inserts/updates).
openjpa.jdbc.MappingDefaults=ForeignKeyDeleteAction=restrict, JoinForeignKeyDeleteAction=restrict

# JDBC batching with the common batch size (the dictionary itself is detected from the connection).
# The default update manager (batching-constraint) batches inserts, updates and deletes per table and
# orders them by foreign key constraints.
openjpa.jdbc.DBDictionary=batchLimit=${bench.jdbc.batchSize}

# no second level cache (DataCache), no query result cache
openjpa.DataCache=false
openjpa.QueryCache=false

# the model is enhanced before OpenJPA uses it: at build time (runner-openjpa-N) or by the -javaagent at class
# load time (runner-openjpa-N-agent, same settings file). No runtime subclassing and no dynamically attached
# agent: an unenhanced class fails instead of being run in a slower mode.
openjpa.RuntimeUnenhancedClasses=unsupported
openjpa.DynamicEnhancementAgent=false

# no SQL logging, no diagnostics
openjpa.Log=DefaultLevel=WARN, Runtime=WARN, Tool=WARN, SQL=WARN, JDBC=WARN, Schema=WARN, MetaData=WARN, Enhance=WARN, Query=WARN
openjpa.ConnectionFactoryProperties=PrintParameters=false
