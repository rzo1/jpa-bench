# Hibernate ORM 7: the provider specific equivalents of the common benchmark settings.
# Merged over bench-core's bench-common.properties; see CONFIG.md for the cross-provider table.
# @...@ is replaced by Maven at build time, ${...} by the harness at run time.

# --- harness -------------------------------------------------------------------------------------
bench.provider.name=Hibernate ORM
bench.provider.version=@hibernate.version@
bench.provider.enhancement=@bench.enhancement@
bench.runner=@project.artifactId@
# Hibernate accepts the DataSource object under the standard JPA key
bench.datasource.keys=jakarta.persistence.nonJtaDataSource

# --- provider ------------------------------------------------------------------------------------
jakarta.persistence.provider=org.hibernate.jpa.HibernatePersistenceProvider

# schema: never generate, update or validate (the DDL scripts are the only source of the schema)
hibernate.hbm2ddl.auto=none

# JDBC batching with the common batch size; inserts and updates ordered so that batches are not broken up
hibernate.jdbc.batch_size=${bench.jdbc.batchSize}
hibernate.order_inserts=true
hibernate.order_updates=true
hibernate.jdbc.batch_versioned_data=true

# no second level cache, no query result cache
hibernate.cache.use_second_level_cache=false
hibernate.cache.use_query_cache=false

# the pool hands out connections with auto-commit already disabled (bench.pool.autoCommit=false)
hibernate.connection.provider_disables_autocommit=true

# no statistics, no SQL logging or comments
hibernate.generate_statistics=false
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.use_sql_comments=false

# Hibernate creates helper tables for multi-table bulk mutations (JOINED hierarchy) at startup on databases
# with global temporary tables (H2). That is schema generation, so it is switched off; no benchmark runs a
# bulk mutation on a multi-table hierarchy.
hibernate.query.mutation_strategy.global_temporary.create_tables=false
hibernate.query.mutation_strategy.global_temporary.drop_tables=false
