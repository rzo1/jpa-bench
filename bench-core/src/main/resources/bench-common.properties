# Settings shared by all runners; provider specific equivalents are in each runner's bench-provider.properties
# (see CONFIG.md). bench.* keys configure the harness and are not passed to the provider; db.<id>.* keys
# (id = h2 | postgresql) apply to one database only; ${key} references another key.

# --- standard Jakarta Persistence settings -------------------------------------------------------
# no second level cache
jakarta.persistence.sharedCache.mode=NONE
# no Bean Validation on lifecycle events
jakarta.persistence.validation.mode=NONE
# the schema comes from bench-data/src/main/resources/ddl/<db>.sql only
jakarta.persistence.schema-generation.database.action=none
jakarta.persistence.schema-generation.scripts.action=none
jakarta.persistence.transactionType=RESOURCE_LOCAL

# --- harness settings ----------------------------------------------------------------------------
# HikariCP pool: fixed size (minimumIdle = maximumPoolSize), auto-commit off, READ_COMMITTED
bench.pool.size=4
bench.pool.isolation=TRANSACTION_READ_COMMITTED
bench.pool.autoCommit=false
# JDBC batch size, referenced by every bench-provider.properties
bench.jdbc.batchSize=50
# keys under which the DataSource object is passed to the provider
bench.datasource.keys=jakarta.persistence.nonJtaDataSource
